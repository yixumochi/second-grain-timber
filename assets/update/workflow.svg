<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1940" viewBox="0 0 1600 1940"><title>TIMBER AI — Isometric research workflow</title><desc>Seller material records feed evidence-based stock preparation. Human–Agent decisions produce confirmed design demands. Both feed original MILP allocation. Saved geometry and allocation support preliminary structural analysis and traceable assembly. Analysis and allocation conflicts return to human confirmation.</desc><rect width="1600" height="1940" fill="#eee6ce"/><g font-family="Consolas,monospace" fill="#292b27" stroke-linejoin="round"><text x="56" y="54" font-size="22" font-weight="600" fill="#596149" >TIMBER AI /</text><text x="56" y="83" font-size="22" font-weight="600" fill="#596149" >RESEARCH WORKFLOW</text><text x="56" y="112" font-size="16" font-weight="400" fill="#696957" >FROM STOCK TO BUILDING</text><text x="56" y="141" font-size="16" font-weight="400" fill="#696957" >REV. 02 / 01 OCT 2026</text><text x="1182" y="56" font-size="17" font-weight="400" fill="#696957" >SOURCE-BOUND</text><text x="1182" y="84" font-size="17" font-weight="400" fill="#696957" >HUMAN-CONFIRMED</text><text x="1182" y="112" font-size="17" font-weight="400" fill="#696957" >PART-TRACEABLE</text><path d="M495,240L170,430" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><path d="M495,365L170,555" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><text x="173" y="395" font-size="23" font-weight="600" fill="#596149" transform="rotate(-30 173 395)">SELLER DATA</text><path d="M495,515L170,705" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><path d="M495,680L170,870" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><text x="173" y="670" font-size="23" font-weight="600" fill="#596149" transform="rotate(-30 173 670)">EVIDENCE + DESIGN</text><path d="M495,925L170,1115" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><path d="M495,1065L170,1255" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><text x="173" y="1080" font-size="23" font-weight="600" fill="#596149" transform="rotate(-30 173 1080)">FABRICATION</text><path d="M495,1230L170,1420" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><path d="M495,1367L170,1557" fill="none" stroke="#42463a" stroke-width="1.6" stroke-dasharray="2 7"/><text x="173" y="1385" font-size="23" font-weight="600" fill="#596149" transform="rotate(-30 173 1385)">ANALYSIS + DELIVERY</text><g id="material-records"><polygon points="510,240 592,192 1401.6,615.2 1319.6,663.2" fill="#c5b68c" stroke="#42463a" stroke-width="2"/><polygon points="1319.6,663.2 1401.6,615.2 1401.6,740.2 1319.6,788.2" fill="#dbcfaf" stroke="#42463a" stroke-width="2"/><polygon points="510,240 1319.6,663.2 1319.6,788.2 510,365" fill="#f7f0df" stroke="#42463a" stroke-width="2"/><g transform="matrix(.88 .46 0 1 529 245)"><text x="0" y="29" font-size="29" font-weight="600" fill="#292b27" >01 / MATERIAL RECORDS</text><text x="0" y="53" font-size="18" font-weight="400" fill="#696957" >Seller listings, source photos &amp; links</text><text x="0" y="76" font-size="18" font-weight="400" fill="#696957" >Recorded dimensions, quantities &amp; claims</text><text x="0" y="99" font-size="18" font-weight="400" fill="#696957" >Material ID is the primary entity</text></g></g><g id="evidence-stock"><polygon points="510,515 592,467 979.2,669.4 897.2,717.4" fill="#c5b68c" stroke="#42463a" stroke-width="2"/><polygon points="897.2,717.4 979.2,669.4 979.2,834.4 897.2,882.4" fill="#dbcfaf" stroke="#42463a" stroke-width="2"/><polygon points="510,515 897.2,717.4 897.2,882.4 510,680" fill="#f7f0df" stroke="#42463a" stroke-width="2"/><g transform="matrix(.88 .46 0 1 529 520)"><text x="0" y="29" font-size="29" font-weight="600" fill="#292b27" >02 / EVIDENCE &amp;</text><text x="0" y="61" font-size="29" font-weight="600" fill="#292b27" >USABLE STOCK</text><text x="0" y="85" font-size="18" font-weight="400" fill="#596149" >Seller claims + visual estimates</text><text x="0" y="108" font-size="18" font-weight="400" fill="#696957" >Preliminary roles / condition</text><text x="0" y="131" font-size="18" font-weight="400" fill="#696957" >Local damage → trim → segments</text></g></g><g id="human-agent"><polygon points="932,736 1014,688 1401.2,890.4 1319.2,938.4" fill="#aeb493" stroke="#42463a" stroke-width="2"/><polygon points="1319.2,938.4 1401.2,890.4 1401.2,1055.4 1319.2,1103.4" fill="#dbcfaf" stroke="#42463a" stroke-width="2"/><polygon points="932,736 1319.2,938.4 1319.2,1103.4 932,901" fill="#f7f0df" stroke="#42463a" stroke-width="2"/><g transform="matrix(.88 .46 0 1 951 741)"><text x="0" y="29" font-size="29" font-weight="600" fill="#292b27" >03 / HUMAN–AGENT</text><text x="0" y="61" font-size="29" font-weight="600" fill="#292b27" >DESIGN</text><text x="0" y="85" font-size="18" font-weight="400" fill="#696957" >Brief → proposals → user decision</text><text x="0" y="108" font-size="18" font-weight="400" fill="#696957" >Confirmed geometry &amp; element IDs</text><text x="0" y="131" font-size="18" font-weight="400" fill="#696957" >Sections + fabrication constraints</text></g></g><g id="milp-allocation"><polygon points="510,925 592,877 1401.6,1300.2 1319.6,1348.2" fill="#c5b68c" stroke="#42463a" stroke-width="2"/><polygon points="1319.6,1348.2 1401.6,1300.2 1401.6,1440.2 1319.6,1488.2" fill="#dbcfaf" stroke="#42463a" stroke-width="2"/><polygon points="510,925 1319.6,1348.2 1319.6,1488.2 510,1065" fill="#f7f0df" stroke="#42463a" stroke-width="2"/><g transform="matrix(.88 .46 0 1 529 930)"><text x="0" y="29" font-size="29" font-weight="600" fill="#292b27" >04 / ORIGINAL MILP ALLOCATION</text><text x="0" y="53" font-size="18" font-weight="400" fill="#696957" >Candidate roles + usable stock + confirmed demands</text><text x="0" y="76" font-size="18" font-weight="400" fill="#696957" >Finite quantities, dimensions, cutting &amp; jointing</text><text