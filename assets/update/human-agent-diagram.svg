<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="355" viewBox="30 418 1220 355" overflow="hidden"><title>method 02 human agent</title><metadata>{"original": "C:\\Users\\yixu1\\Desktop\\timber-method-diagrams.svg", "source_sha256": "4a6515abd355a32618bf31cfb176649c51292ea59e7169066bdd88e9d1203574", "export": "vector region; original vectors and text preserved", "crop_viewbox": [30, 418, 1220, 355]}</metadata><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="method_02_human_agent-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6" fill="none" stroke="#678997" /></marker></defs><rect x="30" y="418" width="1220" height="355" rx="5" fill="#fff" stroke="#cbd5ca" /><text x="52" y="457" font-size="21" fill="#304b3c" font-weight="700">02  YOU DIRECT. THE AGENT PROPOSES. TOOLS COMPUTE.</text><rect x="52" y="492" width="250" height="100" rx="5" fill="#edf3fc" stroke="#cbd5ca" /><text x="68" y="523" font-size="19" fill="#314936" font-weight="700">YOU</text><text x="68" y="551" font-size="15" fill="#647466">Intent, questions, decisions</text><text x="68" y="573" font-size="15" fill="#647466">Accept and confirm explicitly</text><path d="M310,542L364,542M357.85692206676737,545.3559787702294L364,542L357.85692206676737,538.6440212297706" stroke="#678997" stroke-width="2" fill="none" /><rect x="378" y="492" width="270" height="100" rx="5" fill="#f8ecdc" stroke="#cbd5ca" /><text x="394" y="523" font-size="19" fill="#314936" font-weight="700">DESIGN AGENT</text><text x="394" y="551" font-size="15" fill="#647466">Interpret your message</text><text x="394" y="573" font-size="15" fill="#647466">Propose changes to the brief</text><path d="M657,542L716,542M709.8569220667674,545.3559787702294L716,542L709.8569220667674,538.6440212297706" stroke="#678997" stroke-width="2" fill="none" /><rect x="730" y="492" width="480" height="100" rx="5" fill="#edf3ee" stroke="#cbd5ca" /><text x="746" y="523" font-size="19" fill="#314936" font-weight="700">SAVED PROJECT STATE</text><text x="746" y="551" font-size="15" fill="#647466">Confirmed inputs + source-linked stock</text><text x="746" y="573" font-size="15" fill="#647466">Revision-bound geometry, allocation and analysis</text><path d="M514,596v29H173v-28" stroke="#678997" fill="none" stroke-width="2" marker-end="url(#method_02_human_agent-arrow)" /><text x="237" y="650" font-size="14" fill="#647466">Proposal returns to you for acceptance</text><path d="M970,595L970,630M966.6440212297706,623.8569220667674L970,630L973.3559787702294,623.8569220667674" stroke="#678997" stroke-width="2" fill="none" /><rect x="730" y="642" width="228" height="100" rx="5" fill="#edf3ee" stroke="#cbd5ca" /><text x="746" y="673" font-size="19" fill="#314936" font-weight="700">MILP</text><text x="746" y="701" font-size="15" fill="#647466">Match + cut intervals</text><text x="746" y="723" font-size="15" fill="#647466">Preserve source identity</text><rect x="980" y="642" width="230" height="100" rx="5" fill="#edf3ee" stroke="#cbd5ca" /><text x="996" y="673" font-size="19" fill="#314936" font-weight="700">KARAMBA</text><text x="996" y="701" font-size="15" fill="#647466">Recorded analysis basis</text><text x="996" y="723" font-size="15" fill="#647466">Review saved results</text><text x="52" y="735" font-size="16" fill="#647466">Each model reply is distinct from imports, saves and confirmation events.</text></g></svg>