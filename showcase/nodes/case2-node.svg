<text x="30" y="812" font-size="14" font-weight="normal">27 members | 40 internal contacts / 80 ties | 16 contacts / 32 ties cross sample boundary</text>
<text x="30" y="838" font-size="14" font-weight="normal">Retained real supports: PAD03 at S040 B01 and PAD04 at S040 B09 (UZ only; no new restraints).</text>
<text x="30" y="864" font-size="14" font-weight="normal">Cross-boundary connections continue to S038 and S042; an isolated crop is not the full bench.</text>
<text x="30" y="913" font-size="14" font-weight="bold">Decision: preserve R03. No evidence here warrants R04 or a new whole-bench/native solve.</text>
<text x="30" y="939" font-size="14" font-weight="normal">Physical hold: fastener layout/product, grain/end/edge rules, slip/rotational stiffness, bearing, withdrawal and pad friction.</text>
<text x="30" y="974" font-size="14" font-weight="normal">All edge distances are geometric measurements only. Timber remains 38.1 × 88.9 mm; no member or stock change.</text>
<text x="30" y="1000" font-size="14" font-weight="normal">Source-bound R03 forces are extracted separately; timber section forces are not individual fastener demands.</text>
